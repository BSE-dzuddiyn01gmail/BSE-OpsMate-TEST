name: Refresh SISMARP cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe SISMARP direct HTTP
        shell: pwsh
        run: |
          $u='http://www.portal.doa.gov.my/sismarp/welcome/searchtanaman?search=%25'
          $sw=[Diagnostics.Stopwatch]::StartNew()
          try {
            $r=Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 60 -Headers @{'User-Agent'='OpsMate-BSE-SISMARP-Diagnostic/1.0'}
            $sw.Stop()
            Write-Output ('HTTP='+$r.StatusCode)
            Write-Output ('LEN='+$r.Content.Length)
            Write-Output ('SEC='+[math]::Round($sw.Elapsed.TotalSeconds,1))
            Write-Output ('HAS_PERIA='+[bool]($r.Content -match '(?i)peria'))
            Write-Output ('HAS_DETAIL='+[bool]($r.Content -match '/detail/\d+'))
            if($r.StatusCode -ne 200 -or $r.Content.Length -lt 1000000 -or $r.Content -notmatch '/detail/\d+') { exit 2 }
          } catch {
            $sw.Stop()
            Write-Output ('ERR='+$_.Exception.Message)
            Write-Output ('SEC='+[math]::Round($sw.Elapsed.TotalSeconds,1))
            exit 1
          }
