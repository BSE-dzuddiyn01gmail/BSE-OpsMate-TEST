name: Refresh SISMARP cache

on:
  workflow_dispatch:
  schedule:
    # Weekly, Saturday 19:20 UTC = Sunday 03:20 MYT.
    - cron: '20 19 * * 6'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64, sismarp]
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh public SISMARP cache
        shell: pwsh
        run: |
          node scripts/refresh_sismarp_cache.mjs --output "$env:RUNNER_TEMP\sismarp-current.json"

      - name: Update derived cache branch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree prune
          git fetch origin sismarp-cache
          $wt=Join-Path $env:RUNNER_TEMP 'sismarp-cache-worktree'
          if(Test-Path $wt){Remove-Item $wt -Recurse -Force}
          git worktree add $wt origin/sismarp-cache
          Set-Location $wt
          git switch -C sismarp-cache origin/sismarp-cache
          New-Item -ItemType Directory -Force -Path 'data\sismarp' | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sismarp-current.json') 'data\sismarp\current.json' -Force
          git add data/sismarp/current.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){
            Write-Output 'No SISMARP cache change.'
            Set-Location $env:GITHUB_WORKSPACE
            git worktree remove --force $wt
            exit 0
          }
          if($LASTEXITCODE -ne 1){throw 'git diff --cached failed'}
          git commit -m 'data: refresh SISMARP current cache'
          git push origin HEAD:sismarp-cache
          Set-Location $env:GITHUB_WORKSPACE
          git worktree remove --force $wt
          git worktree prune
